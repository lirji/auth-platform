<text x="28" y="119" class="label">WORKSPACE</text><rect x="16" y="136" width="192" height="42" rx="8" fill="#eef3ff"/><rect x="16" y="149" width="3" height="16" rx="1.5" fill="#315efb"/>
<use href="#grid" x="29" y="147" width="20" height="20"/><text x="60" y="163" class="body bold blue">我的工作台</text>

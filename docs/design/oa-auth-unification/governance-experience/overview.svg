<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">权限控制台工作台设计稿</title><desc id="desc">静态规划稿，基于当前可见的 local-commerce、commerce、local、内部成员、有管理入口且无业务入口的事实。未实现的视觉设计，不代表运行截图。</desc>
<defs><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033} .muted{fill:#596579}.small{font-size:12px}.body{font-size:14px}.label{font-size:11px;letter-spacing:1.5px;fill:#596579}.bold{font-weight:600}.line{stroke:#e1e5ec;stroke-width:1}.icon{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:#596579}.blue{fill:#315efb}.white{fill:white}</style>

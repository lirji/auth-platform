<path d="M292 484h664" class="line"/>
<text x="292" y="515" class="small muted">管理授权</text><rect x="370" y="497" width="56" height="25" rx="6" fill="#eaf5ef"/><text x="383" y="514" class="small" fill="#176548" style="fill:#176548">可用</text><text x="292" y="544" class="body muted">管理权限与业务访问分别授权。</text>
<rect x="292" y="566" width="164" height="38" rx="8" fill="#315efb"/><text x="309" y="590" class="body white">进入授权管理</text><path d="M429 585h11m-4-4 4 4-4 4" stroke="white" stroke-width="1.5" fill="none"/>

<rect x="1016" y="232" width="376" height="398" rx="14" fill="#fff" stroke="#e1e5ec"/>
<text x="1040" y="264" class="label">02 / PERSONAL ACCESS</text>
<use href="#shield" x="1040" y="308" width="22" height="22"/><text x="1074" y="325" font-size="18" font-weight="600">权限来源</text><use href="#arrow" x="1344" y="308" width="22" height="22"/>
<text x="1040" y="363" class="body muted">逐条查看授予你的固定角色、能力、</text><text x="1040" y="388" class="body muted">资源范围与有效期。</text>
<path d="M1040 426h328" class="line"/>
<use href="#sheet" x="1040" y="462" width="22" height="22"/><text x="1074" y="479" font-size="18" font-weight="600">申请与通知</text><use href="#arrow" x="1344" y="462" width="22" height="22"/>
<text x="1040" y="518" class="body muted">跟进申请的审批进度，</text><text x="1040" y="543" class="body muted">以及审批后的实际生效状态。</text>
<path d="M264 674h1128" class="line"/>
<text x="264" y="710" font-size="15" font-weight="600">理解你的访问边界</text><text x="264" y="739" class="body muted">可以管理授权，并不自动获得业务访问权限。每一条授权都有独立的能力、范围与有效期。</text>
<text x="264" y="847" class="small muted">组织 · local-commerce</text><text x="1194" y="847" class="small muted">静态设计稿 · 尚未实现</text>

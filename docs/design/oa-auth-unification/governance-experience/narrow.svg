<path d="M16 60h358" class="line"/><text x="20" y="85" class="body" font-weight="600">local-commerce</text><path d="m149 78 4 4 4-4" class="icon"/><text x="20" y="104" class="small muted">commerce / local</text><path d="M0 116h390" class="line"/>
<text x="20" y="151" class="label">GOVERNANCE / OVERVIEW</text><text x="20" y="191" font-size="26" font-weight="650">我的工作台</text><rect x="282" y="159" width="88" height="44" rx="8" stroke="#8994a6" fill="white"/><text x="298" y="186" class="body">刷新应用</text>
<text x="20" y="224" class="body muted">确认访问范围，继续授权作业。</text>

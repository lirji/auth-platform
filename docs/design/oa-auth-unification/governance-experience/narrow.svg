<text x="36" y="281" class="label">01 / CURRENT APPLICATION</text><rect x="36" y="303" width="42" height="42" rx="10" fill="#eef3ff"/><path d="m47 316 10-5 10 5v14l-10 5-10-5Zm0 0 10 5 10-5m-10 5v14" stroke="#315efb" stroke-width="1.5" fill="none"/><text x="93" y="323" font-size="22" font-weight="600">commerce</text><text x="93" y="343" class="small muted">当前应用 · local</text>
<path d="M36 369h318" class="line"/><text x="36" y="398" class="small muted">业务访问</text><circle cx="41" cy="424" r="4" fill="#854b12"/><text x="54" y="430" font-size="16" font-weight="600">当前暂无可用业务入口</text><text x="36" y="458" class="body muted">你仍可查看权限来源、申请进度，</text><text x="36" y="481" class="body muted">或继续已有的管理作业。</text>
<path d="M36 507h318" class="line"/><text x="36" y="538" class="small muted">管理授权</text><rect x="113" y="519" width="52" height="25" rx="6" fill="#eaf5ef"/><text x="127" y="536" class="small" style="fill:#176548">可用</text><text x="36" y="567" class="body muted">管理权限与业务访问分别授权。</text><rect x="36" y="589" width="318" height="46" rx="8" fill="#315efb"/><text x="135" y="618" class="body" style="fill:white">进入授权管理 →</text>
<rect x="16" y="680" width="358" height="258" rx="14" fill="white" stroke="#e1e5ec"/><text x="36" y="711" class="label">02 / PERSONAL ACCESS</text><text x="36" y="746" font-size="17" font-weight="600">权限来源</text><text x="332" y="746" font-size="20">→</text><text x="36" y="775" class="body muted">查看角色、资源范围与有效期。</text><path d="M36 803h318" class="line"/><text x="36" y="840" font-size="17" font-weight="600">申请与通知</text><text x="332" y="840" font-size="20">→</text><text x="36" y="869" class="body muted">跟进申请及实际生效状态。</text>
<text x="20" y="975" class="small muted">可以管理授权，并不自动获得业务访问权限。</text><text x="20" y="1036" class="small muted">静态设计稿 · 窄屏单列 · 尚未实现</text>

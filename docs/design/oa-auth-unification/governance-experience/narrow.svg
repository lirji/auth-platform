<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1080" viewBox="0 0 390 1080" role="img" aria-labelledby="title desc">
<title id="title">权限工作台窄屏设计稿</title><desc id="desc">390像素宽静态布局规划；菜单收起、上下文换行、工作区单列。不是运行截图。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}.muted{fill:#596579}.body{font-size:14px}.small{font-size:12px}.label{font-size:11px;letter-spacing:1px;fill:#596579}.line{stroke:#e1e5ec}.icon{stroke:#596579;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs>
<rect width="390" height="1080" fill="#f5f6f8"/><rect width="390" height="116" fill="white"/>

name: Auth Platform CI

on:
  pull_request:
    paths:
      - 'auth-platform-*/**'
      - 'deploy/risk-*.sh'
      - 'deploy/recon-platform-provision.sh'
      - 'deploy/benefit-platform-provision.sh'
      - 'deploy/governance-test-db.py'
      - 'deploy/governance-context-smoke.py'
      - 'deploy/governance-invitation-smoke.py'
      - 'deploy/governance-casdoor-*.py'
      - 'deploy/governance-access-smoke.py'
      - 'deploy/governance-graph-isolation.py'
      - 'deploy/governance-approval-start-smoke.py'
      - 'deploy/governance-p4-*'
      - 'deploy/governance-p5-*'
      - 'deploy/governance-p6-*'
      - 'deploy/governance-ce05-*'
      - 'deploy/governance-p7-*'
      - 'deploy/verify-commerce-contract.py'
      - 'deploy/tests/test_commerce_contract.py'
      - 'docs/design/oa-auth-unification/COMMERCE_PERMISSION_BINDINGS.json'
      - 'docs/implementation/oa-auth/commerce-readiness/HTTP_INVENTORY.md'
      - 'deploy/tests/test_governance_p6*'
      - 'deploy/tests/test_governance_segments*'
      - 'deploy/tests/test_governance_p7*'
      - 'compatibility/boot4-sdk/**'
      - 'auth-console/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - '.github/workflows/authz-ci.yml'
  push:
    branches: [main]
    paths:
      - 'auth-platform-*/**'
      - 'deploy/risk-*.sh'
      - 'deploy/recon-platform-provision.sh'
      - 'deploy/benefit-platform-provision.sh'
      - 'deploy/governance-test-db.py'
      - 'deploy/governance-context-smoke.py'
      - 'deploy/governance-invitation-smoke.py'
      - 'deploy/governance-casdoor-*.py'
      - 'deploy/governance-access-smoke.py'
      - 'deploy/governance-graph-isolation.py'
      - 'deploy/governance-approval-start-smoke.py'
      - 'deploy/governance-p4-*'
      - 'deploy/governance-p5-*'
      - 'deploy/governance-p6-*'
      - 'deploy/governance-ce05-*'
      - 'deploy/governance-p7-*'
      - 'deploy/verify-commerce-contract.py'
      - 'deploy/tests/test_commerce_contract.py'
      - 'docs/design/oa-auth-unification/COMMERCE_PERMISSION_BINDINGS.json'
      - 'docs/implementation/oa-auth/commerce-readiness/HTTP_INVENTORY.md'
      - 'deploy/tests/test_governance_p6*'
      - 'deploy/tests/test_governance_segments*'
      - 'deploy/tests/test_governance_p7*'
      - 'compatibility/boot4-sdk/**'
      - 'auth-console/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - '.github/workflows/authz-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authz-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Create isolated governance database owner
        run: |
          docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE governance_ci LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'isolated-ci-fixture';
          CREATE DATABASE auth_gov_p1_test_ci OWNER governance_ci;
          SQL
      - run: ./mvnw -B -Pgovernance-it verify
        env:
          GOVERNANCE_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/auth_gov_p1_test_ci
          GOVERNANCE_TEST_DB_USER: governance_ci
          GOVERNANCE_TEST_DB_PASSWORD: isolated-ci-fixture
      - name: Validate onboarding scripts
        run: |
          python3 -m unittest discover -s deploy/tests -p 'test_commerce_contract.py' -v
          python3 -m unittest discover -s deploy/tests -p 'test_governance_p6*.py' -v
          python3 -m unittest discover -s deploy/tests -p 'test_governance_segments*.py' -v
          python3 -m py_compile deploy/governance-p6-migration.py deploy/governance-p6-rehearsal.py deploy/governance-ce05-segments.py
          python3 -m py_compile deploy/governance-p4-e2e.py deploy/governance-p4-runtime.py deploy/governance-approval-start-smoke.py deploy/governance-p5-commerce.py deploy/governance-p5-login.py deploy/governance-p5-packaged.py
          bash -n deploy/risk-platform-provision.sh deploy/risk-authz-fixture.sh \
            deploy/recon-platform-provision.sh deploy/benefit-platform-provision.sh
          grep -q 'definition risk_case' auth-platform-core/src/main/resources/schemas/risk.zed
          grep -q 'permission work = assignee' auth-platform-core/src/main/resources/schemas/risk.zed
      - name: Validate P7 bounded rehearsal
        run: |
          python3 -m py_compile deploy/governance-p7-rehearsal.py deploy/governance-casdoor-isolation.py deploy/governance-casdoor-fixture.py
          python3 -m unittest discover -s deploy/tests -p 'test_governance_p7*.py' -v
      - name: Prepare pinned isolated identity provider
        run: |
          python3 deploy/governance-test-db.py --container '${{ job.services.postgres.id }}' --port 5432
          docker pull casbin/casdoor@sha256:138b5e46d49ad678ea2d53487fa74f8aae6e3ee3a670fc1b62ebe981c2a9d964
          GOV_TEST_NETWORK="$(docker inspect --format '{{range $key, $value := .NetworkSettings.Networks}}{{print $key}}{{end}}' '${{ job.services.postgres.id }}')"
          python3 deploy/governance-casdoor-isolation.py \
            --postgres-container '${{ job.services.postgres.id }}' --postgres-host postgres --network "$GOV_TEST_NETWORK"
          python3 deploy/governance-casdoor-fixture.py --base http://localhost:18090 --phase tokens \
            --directory .local/governance/casdoor-isolated \
            --management-config .local/governance/casdoor-isolated/management-client.json
      - name: Verify real identity binding (P1-02 only)
        run: ./mvnw -B -pl auth-platform-governance -am -Pgovernance-identity-it verify
        env:
          GOVERNANCE_TEST_CONFIG: ${{ github.workspace }}/.local/governance/database.properties
          GOVERNANCE_IDENTITY_FIXTURE: ${{ github.workspace }}/.local/governance/casdoor-isolated
      - name: Verify governance HTTP boundaries and controlled suspension (P1-03/06)
        run: python3 deploy/governance-context-smoke.py
      - name: Verify external invitations with a separate identity namespace (P1-05)
        run: |
          python3 deploy/governance-casdoor-fixture.py --base http://localhost:18090 --phase tokens \
            --directory .local/governance/p1-05-idp \
            --management-config .local/governance/casdoor-isolated/management-client.json
          python3 deploy/governance-invitation-smoke.py

      - name: Verify Boot4 SDK source compatibility
        run: |
          ./mvnw -B -pl auth-platform-sdk -am install -DskipTests
          ./mvnw -B -f compatibility/boot4-sdk/pom.xml test
      - name: Prepare independent persistent governance graph
        run: |
          GOV_TEST_NETWORK="$(docker inspect --format '{{range $key, $value := .NetworkSettings.Networks}}{{print $key}}{{end}}' '${{ job.services.postgres.id }}')"
          python3 deploy/governance-graph-isolation.py --postgres-container '${{ job.services.postgres.id }}' --port 5432 --postgres-host postgres --network "$GOV_TEST_NETWORK"
      - name: Verify real graph failure and recovery boundaries
        run: ./mvnw -B -pl auth-platform-governance -am -Pgovernance-graph-it verify
        env:
          GOVERNANCE_TEST_CONFIG: ${{ github.workspace }}/.local/governance/database.properties
          GOVERNANCE_GRAPH_CONFIG: ${{ github.workspace }}/.local/governance/p2/graph/graph.properties
      - name: Prepare P3 CAS graph on its own persistent database
        run: |
          GOV_TEST_NETWORK="$(docker inspect --format '{{range $key, $value := .NetworkSettings.Networks}}{{print $key}}{{end}}' '${{ job.services.postgres.id }}')"
          python3 deploy/governance-graph-isolation.py --phase p3 --postgres-container '${{ job.services.postgres.id }}' --port 5432 --postgres-host postgres --network "$GOV_TEST_NETWORK"
      - name: Verify P3 remote CAS and recovery protocol
        run: ./mvnw -B -pl auth-platform-governance -am -Pgovernance-projection-it verify
        env:
          GOVERNANCE_TEST_CONFIG: ${{ github.workspace }}/.local/governance/database.properties
          GOVERNANCE_P3_GRAPH_CONFIG: ${{ github.workspace }}/.local/governance/p3/graph/graph.properties
      - name: Verify application RBAC and own menus through real HTTP
        run: |
          python3 deploy/governance-casdoor-fixture.py --base http://localhost:18090 --phase tokens --directory .local/governance/p2/identity --management-config .local/governance/casdoor-isolated/management-client.json
          python3 deploy/governance-access-smoke.py --with-checks
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Check portal browser harness syntax
        run: |
          for script in deploy/governance-p5-*.mjs deploy/governance-p6-catalog.mjs deploy/governance-ce05-campaigns.mjs; do node --check "$script"; done
          node --test auth-console/tests/governance-context.test.mjs
      - name: Build governance console
        run: pnpm --dir auth-console install --frozen-lockfile && pnpm --dir auth-console build

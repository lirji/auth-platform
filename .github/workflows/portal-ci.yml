name: Project Portal CI

on:
  pull_request:
    paths:
      - 'project-portal/**'
      - 'deploy/load-platform-ports.sh'
      - 'deploy/platform-compose.sh'
      - 'deploy/platform-ports.env'
      - 'deploy/platform-ports.sh'
      - 'deploy/sync-platform-catalog.mjs'
      - 'deploy/verify-compose-port.mjs'
      - 'deploy/docker-compose.yml'
      - 'deploy/.env.example'
      - 'deploy/postgres-init/**'
      - 'deploy/governance/**'
      - 'auth-platform-admin/Dockerfile'
      - 'auth-platform-server/Dockerfile'
      - 'auth-console/Dockerfile'
      - 'auth-console/.dockerignore'
      - 'auth-console/nginx.conf'
      - '.dockerignore'
      - '.github/workflows/portal-ci.yml'
  push:
    branches: [main]
    paths:
      - 'project-portal/**'
      - 'deploy/load-platform-ports.sh'
      - 'deploy/platform-compose.sh'
      - 'deploy/platform-ports.env'
      - 'deploy/platform-ports.sh'
      - 'deploy/sync-platform-catalog.mjs'
      - 'deploy/verify-compose-port.mjs'
      - 'deploy/docker-compose.yml'
      - 'deploy/.env.example'
      - 'deploy/postgres-init/**'
      - 'deploy/governance/**'
      - 'auth-platform-admin/Dockerfile'
      - 'auth-platform-server/Dockerfile'
      - 'auth-console/Dockerfile'
      - 'auth-console/.dockerignore'
      - 'auth-console/nginx.conf'
      - '.dockerignore'
      - '.github/workflows/portal-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-portal
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: project-portal/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node ../deploy/sync-platform-catalog.mjs --check
      - run: pnpm test:run
      - run: pnpm typecheck
      - run: pnpm build
      - name: Build production image
        working-directory: .
        run: docker build -t project-portal:ci ./project-portal
      - name: Check deployment configuration
        working-directory: .
        run: |
          bash -n deploy/governance/run.sh
          docker compose --env-file deploy/.env.example --env-file deploy/platform-ports.env -f deploy/docker-compose.yml config --quiet
          docker compose --env-file deploy/.env.example --env-file deploy/platform-ports.env -f deploy/docker-compose.yml --profile governance config --quiet
          docker compose --env-file deploy/.env.example --env-file deploy/platform-ports.env -f deploy/docker-compose.yml --profile wms-auth config --quiet
      - name: Build governance images from source without private configuration
        working-directory: .
        run: bash deploy/governance/run.sh build
      - name: Build WMS authorization image from source without private configuration
        working-directory: .
        run: docker compose --env-file deploy/.env.example --env-file deploy/platform-ports.env -f deploy/docker-compose.yml --profile wms-auth build governance-wms-server

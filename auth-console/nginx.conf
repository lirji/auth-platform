# auth-console 生产托管 + 同源反代 /admin -> auth-platform-admin (免 CORS)。
# ADMIN_URL 默认 host.docker.internal:8201(宿主机跑 admin);容器化 admin 时改成服务名。
server {
    listen 8202;
    large_client_header_buffers 4 64k;
    server_name _;
    root /usr/share/nginx/html;

    # /admin/* 同源反代到 admin(透传 Authorization Bearer)
    location /admin/ {
        proxy_pass http://host.docker.internal:8201;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # 治理接口同源透传，身份仍由admin独立管理Token验证；响应不缓存。
    location /api/governance/ {
        proxy_pass http://host.docker.internal:8201;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 20s;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 门户跨域探测；不回退到 index.html
    location = /healthz {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store";
        default_type text/plain;
        return 200 "ok\n";
    }

    # HTML 必须重校验，避免更新镜像后仍用旧入口引用历史 assets。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # SPA history 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}

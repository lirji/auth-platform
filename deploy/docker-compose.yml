# 内部统一权限平台 — 基建 (Phase 0) + 公开能力门户
# Casdoor(身份/SSO) + SpiceDB(ReBAC 授权) + Postgres(SpiceDB & Casdoor datastore) + project-portal
# 端口全部变量化，避开现有项目占用(8080-8092 / 9000-9008 / 5432 / 6379 等)。
# 启停时显式指定服务；同项目的治理 profile 可能正在使用共享网络。
name: auth-platform

services:
  authz-postgres:
    image: postgres:16
    container_name: authz-postgres
    environment:
      POSTGRES_USER: ${PG_USER:-authz}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-authz_dev_pw}
      POSTGRES_DB: spicedb          # SpiceDB 库; Casdoor 库由 Casdoor 自建(dbName=casdoor)
    ports:
      - "${SPICEDB_PG_PORT:-15432}:5432"
    volumes:
      - authz-pg-data:/var/lib/postgresql/data
      # 首次初始化时建 authz_admin(审计持久化库); 存量卷需手动 createdb(见 postgres-init/*.sql 头注)
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-authz} -d spicedb"]
      interval: 5s
      timeout: 3s
      retries: 30

  # 一次性: SpiceDB postgres datastore 迁移(serve 前必须跑)
  spicedb-migrate:
    image: ${SPICEDB_IMAGE:-authzed/spicedb:v1.56.2@sha256:aa96009a0477f8a759149823407d47ad16d1a74390bae3102b3b0b7143502764}
    container_name: authz-spicedb-migrate
    command: datastore migrate head
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: "postgres://${PG_USER:-authz}:${PG_PASSWORD:-authz_dev_pw}@authz-postgres:5432/spicedb?sslmode=disable"
    depends_on:
      authz-postgres:
        condition: service_healthy
    restart: on-failure

  spicedb:
    image: ${SPICEDB_IMAGE:-authzed/spicedb:v1.56.2@sha256:aa96009a0477f8a759149823407d47ad16d1a74390bae3102b3b0b7143502764}
    container_name: authz-spicedb
    command: serve
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: ${SPICEDB_KEY:-authz_dev_key}
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: "postgres://${PG_USER:-authz}:${PG_PASSWORD:-authz_dev_pw}@authz-postgres:5432/spicedb?sslmode=disable"
      SPICEDB_HTTP_ENABLED: "true"   # 开 REST 网关便于 curl 验证 / knowledge-service 走 HTTP 传输
    ports:
      - "${SPICEDB_GRPC_PORT:-50051}:50051"   # gRPC
      - "${SPICEDB_HTTP_PORT:-8543}:8443"     # HTTP API(默认 8443 -> 宿主 8543)
      - "${SPICEDB_METRICS_PORT:-9099}:9090"  # Prometheus(默认 9090 被占 -> 宿主 9099)
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully

  casdoor:
    # 保持原身份服务的已验证摘要；治理身份由可选 dependencies.compose.yml 单独管理。
    image: ${CASDOOR_IMAGE:-casbin/casdoor@sha256:1b479655bf51b1c630f2a3ea93ec1ef58388e1d5861173377269266ea321537e}
    container_name: authz-casdoor
    environment:
      # 与 PostgreSQL 的 env 同源，避免修改 PG_USER/PG_PASSWORD 后仍使用 app.conf 旧值。
      driverName: postgres
      dataSourceName: "user=${PG_USER:-authz} password=${PG_PASSWORD:-authz_dev_pw} host=authz-postgres port=5432 sslmode=disable dbname=spicedb"
      origin: "http://localhost:${CASDOOR_PORT:-8000}"
      originFrontend: "http://localhost:${CASDOOR_PORT:-8000}"
    ports:
      - "${CASDOOR_PORT:-8000}:8000"
    volumes:
      - ./casdoor/app.conf:/conf/app.conf:ro
    depends_on:
      authz-postgres:
        condition: service_healthy

  # 公开免登录门户；运行时 catalog 以只读挂载覆盖镜像内默认值，修改目录无需重建镜像。
  project-portal:
    build:
      context: ../project-portal
      dockerfile: Dockerfile
    image: ${AUTH_PORTAL_IMAGE:-auth-platform/project-portal:local}
    container_name: auth-project-portal
    ports:
      - "127.0.0.1:${AUTH_PORTAL_UI_PORT:-5274}:80"
    volumes:
      - ../project-portal/public/config/catalog.json:/usr/share/nginx/html/config/catalog.json:ro

  # 本地治理控制台：复用显式配置的 dev_infra PostgreSQL、Casdoor 4.11 与治理图。
  # 三个进程共享回环网络，保持已有 issuer 的严格 localhost 校验；只公开 UI。
  auth-console:
    profiles: [governance]
    image: ${GOVERNANCE_CONSOLE_IMAGE:-auth-platform/governance-console:local}
    build:
      context: ../auth-console
      args:
        VITE_CASDOOR_AUTHORITY: http://localhost:18090
        VITE_CASDOOR_CLIENT_ID: ${GOVERNANCE_CLIENT_ID:-auth-console-docker}
    container_name: auth-governance-console
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AUTH_CONSOLE_UI_PORT:-5273}:8202"
    volumes:
      - ./governance/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ${GOVERNANCE_GRAPH_RELAY_FILE:-./governance/graph-peer-default.conf}
        target: /etc/nginx/governance-graph-peer.conf
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8202/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  governance-admin:
    profiles: [governance]
    image: ${GOVERNANCE_ADMIN_IMAGE:-auth-platform/governance-admin:local}
    build: &governance-admin-build
      context: ..
      dockerfile: auth-platform-admin/Dockerfile
    container_name: auth-governance-admin
    restart: unless-stopped
    network_mode: service:auth-console
    depends_on:
      auth-console:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${GOVERNANCE_RUNTIME_DIR:-../.local/docker-governance/runtime}
        target: /run/governance
        read_only: true
        bind:
          create_host_path: false
    command:
      - java
      - -Xmx384m
      - -jar
      - /app/admin.jar
      - --server.address=127.0.0.1
      - --authz.governance.enabled=true
      - --authz.governance.configuration=/run/governance/admin.properties
      - --authz.governance.access.enabled=true
      - --authz.governance.presentation.enabled=true
      - --authz.governance.scope.enabled=true
      - --authz.governance.invitations.enabled=true
      - --authz.governance.requests.enabled=true
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8201/actuator/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  governance-projector:
    profiles: [governance]
    image: ${GOVERNANCE_ADMIN_IMAGE:-auth-platform/governance-admin:local}
    # 直接 compose build/up --build 时也能从源码获得同一版本的投影 CLI。
    build: *governance-admin-build
    container_name: auth-governance-projector
    restart: unless-stopped
    network_mode: service:auth-console
    depends_on:
      governance-admin:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${GOVERNANCE_RUNTIME_DIR:-../.local/docker-governance/runtime}
        target: /run/governance
        read_only: true
        bind:
          create_host_path: false
      - ./governance/projector.sh:/app/projector.sh:ro
    command: [bash, /app/projector.sh]
    healthcheck:
      test: [CMD-SHELL, "test -f /tmp/projection-ready && test $$(($$(date +%s) - $$(cat /tmp/projection-ready))) -lt 120"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 90s

  # WMS中央调用入口；复用现有治理数据库/图/身份，只对本机提供HTTPS。
  governance-wms-relay:
    profiles: [wms-auth]
    image: nginx:1.27-alpine
    container_name: auth-governance-wms-relay
    networks: [default, wms-identity]
    # 实际Graph容器地址由受控准备工具核对；未配置只指向回环并失败关闭。
    extra_hosts:
      wms-governance-graph: ${WMS_AUTH_GRAPH_IPV4:-127.0.0.1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WMS_AUTH_SERVER_PORT:-18545}:18545"
    volumes:
      - ./governance/wms-relay.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:18547/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  governance-wms-init:
    profiles: [wms-auth]
    image: ${WMS_AUTH_SERVER_IMAGE:-auth-platform/governance-wms-server:local}
    build: &wms-server-build
      context: ..
      dockerfile: auth-platform-server/Dockerfile
    user: "0:0"
    entrypoint: [bash, /app/wms-private-init.sh]
    restart: "no"
    volumes:
      - type: bind
        source: ${WMS_AUTH_BOOTSTRAP_DIR:-../.local/wms-auth-integration/docker/bootstrap}
        target: /bootstrap
        read_only: true
        bind: {create_host_path: false}
      - ./governance/wms-private-init.sh:/app/wms-private-init.sh:ro
      - wms-server-credentials:/private/server
      - wms-inventory-credentials:/private/inventory
      - wms-inbound-credentials:/private/inbound
      - wms-outbound-credentials:/private/outbound
      - wms-fulfillment-credentials:/private/fulfillment
      - wms-serial-credentials:/private/serial-registry

  governance-wms-server:
    profiles: [wms-auth]
    image: ${WMS_AUTH_SERVER_IMAGE:-auth-platform/governance-wms-server:local}
    build: *wms-server-build
    container_name: auth-governance-wms-server
    restart: unless-stopped
    network_mode: service:governance-wms-relay
    depends_on:
      governance-wms-relay: {condition: service_healthy, restart: true}
      governance-wms-init: {condition: service_completed_successfully}
    command: ["--spring.config.additional-location=file:/run/wms-auth/application.properties"]
    volumes:
      - wms-server-credentials:/run/wms-auth:ro
    healthcheck:
      test: [CMD-SHELL, "curl --cacert /run/wms-auth/ca.pem -fsS https://localhost:18545/actuator/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

volumes:
  authz-pg-data:
  wms-server-credentials: {name: auth-platform-wms-server-credentials}
  wms-inventory-credentials: {name: auth-platform-wms-inventory-credentials}
  wms-inbound-credentials: {name: auth-platform-wms-inbound-credentials}
  wms-outbound-credentials: {name: auth-platform-wms-outbound-credentials}
  wms-fulfillment-credentials: {name: auth-platform-wms-fulfillment-credentials}
  wms-serial-credentials: {name: auth-platform-wms-serial-credentials}

# 显式复用已运行Casdoor的dev_infra网络；不创建新的数据库或身份实例。
networks:
  wms-identity: {external: true, name: "${WMS_IDENTITY_NETWORK:-dev-infra}"}

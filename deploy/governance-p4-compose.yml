# P4独立审批总线：原workflow listener使用固定group，不能与共享Kafka共用。
name: auth-governance-p4
services:
  postgres:
    image: postgres:16-alpine
    ports: ["127.0.0.1:15434:5432"]
    environment:
      POSTGRES_USER: p4_runtime
      POSTGRES_PASSWORD: ${P4_POSTGRES_PASSWORD:?Private local runtime credential}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p4_runtime"]
      interval: 3s
      timeout: 3s
      retries: 15
  kafka:
    image: apache/kafka:3.8.0
    ports: ["127.0.0.1:19492:19092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19492
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 15
  workflow:
    image: ${P4_WORKFLOW_IMAGE:?Use the inspected existing workflow image ID}
    ports: ["127.0.0.1:18300:8300"]
    depends_on:
      kafka: {condition: service_healthy}
    volumes:
      - ${P4_WORKFLOW_CONFIG:?Private isolated datasource configuration}:/run/p4/application.properties:ro
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/run/p4/application.properties
      WORKFLOW_KAFKA: kafka:9092
      WORKFLOW_SECURITY_ENABLED: "false"
      WORKFLOW_KAFKA_TRUST_ENABLED: "false"
      WORKFLOW_FLOWABLE_SCHEMA_UPDATE: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8300/actuator/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  kafka-data:
  postgres-data:

# 仅共享命名空间的回环口；固定issuer及治理图边界与现有console保持一致。
log_format wms_relay '$time_iso8601 $server_port $uri $status $request_time $upstream_response_time';
resolver 127.0.0.11 ipv6=off valid=30s;
# 本机nginx1.27.5支持后台更新共享upstream地址；请求不等待短DNS缓存重新解析。
upstream wms_identity {
    zone wms_identity 64k;
    # 直接复用既有IdP所在网络，避免经过Docker Desktop本机发布端口再次转发。
    server auth-governance-casdoor:8000 resolve;
}
upstream wms_graph {
    zone wms_graph 64k;
    # extra_hosts只绑定准备工具核对的既有Graph；绕过本机发布端口，容器重建后需重新核对绑定。
    server wms-governance-graph:8443;
}
server {
    # 在server级覆盖基础镜像继承的combined日志，避免查询参数被另一个日志格式记录。
    access_log /dev/stdout wms_relay;
    listen 18547;
    location = /healthz { return 200 "ok\n"; }
}
server {
    access_log /dev/stdout wms_relay;
    listen 127.0.0.1:18090;
    large_client_header_buffers 4 64k;
    location / {
        proxy_pass http://wms_identity;
        proxy_set_header Host localhost:18090;
        proxy_buffer_size 64k;
        proxy_buffers 4 64k;
    }
}
server {
    access_log /dev/stdout wms_relay;
    listen 127.0.0.1:18544;
    location / {
        proxy_pass http://wms_graph;
    }
}
